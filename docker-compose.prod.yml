version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: boothmagic-db-prod
    environment:
      POSTGRES_DB: booth
      POSTGRES_USER: booth
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booth -d booth"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: boothmagic-app-prod
    environment:
      DATABASE_URL: postgresql://booth:${DB_PASSWORD}@db:5432/booth
      AUTH_SECRET: ${AUTH_SECRET}
      FILE_TOKEN_SECRET: ${FILE_TOKEN_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MAIL_FROM: ${MAIL_FROM}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      ENABLE_VIDEO: ${ENABLE_VIDEO}
      ENABLE_SLIDESHOW: ${ENABLE_SLIDESHOW}
      CRON_SECRET: ${CRON_SECRET}
      STORAGE_DIR: "/data/storage"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN}
    volumes:
      - ./data/storage:/data/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2
    container_name: boothmagic-caddy-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
