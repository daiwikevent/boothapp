# docker-compose.yml — BoothMagic local development
# Provides a PostgreSQL 16 database only.
# The Next.js app runs via `npm run dev` on the host.
#
# Usage:
#   docker compose up -d db        # start postgres in background
#   docker compose down            # stop and remove containers
#   docker compose down -v         # also wipe the data volume

version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: boothmagic-db
    environment:
      POSTGRES_DB: booth
      POSTGRES_USER: booth
      POSTGRES_PASSWORD: boothdev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booth -d booth"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
